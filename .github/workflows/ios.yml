name: iOS Build Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa / Runner.app)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Unsigned Release)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ENVIRONMENT=production \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://xyzcompany.supabase.co' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy_anon_key' }}

      - name: Package iOS App (.ipa Payload)
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r PrawnGuard-iOS-unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prawnguard-ios-unsigned-ipa
          path: build/ios/iphoneos/PrawnGuard-iOS-unsigned.ipa
          retention-days: 14
