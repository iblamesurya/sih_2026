name: PrawnGuard Release Publisher

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    name: Build & Publish Production Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK & AppBundle
        run: |
          mkdir -p build/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=ENVIRONMENT=production \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://xyzcompany.supabase.co' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy_anon_key' }}
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=ENVIRONMENT=production \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://xyzcompany.supabase.co' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy_anon_key' }}

      - name: Generate Checksums
        run: |
          cd build/app/outputs/flutter-apk && sha256sum app-release.apk > app-release.apk.sha256
          cd ../bundle/release && sha256sum app-release.aab > app-release.aab.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
