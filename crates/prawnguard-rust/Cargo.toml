[package]
name = "prawnguard-rust"
version = "0.1.0"
edition = "2021"
authors = ["PrawnGuard.ai Engineering <dev@prawnguard.ai>"]
description = "Native Rust aquaculture operations & AI telemetry engine for PrawnGuard.ai (AquaVerse)"

[lib]
name = "prawnguard_rust"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "prawnguard"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
thiserror = "1.0"
